<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sadece Sana...</title>
  <style>
    body {
      background: #fce4ec;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
      color: #d81b60;
    }
    p {
      font-size: 1.3em;
      margin-top: 20px;
    }
    .heart {
      font-size: 50px;
      color: red;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .button {
      margin-top: 40px;
      padding: 15px 30px;
      background: #d81b60;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      cursor: pointer;
      transition: 0.3s;
    }
    .button:hover {
      background: #ad1457;
    }
  </style>
</head>
<body>
  <h1>Affet Beni ❤️</h1>
  <p>Canımın içi, seni kırdığım için çok üzgünüm...</p>
  <p>Keşke zamanı geri alabilsem ve Allahına sövmesem.</p>
  <p>Sensiz geçen her saniye eksik hissediyorum.</p>
  <p>Çünkü seni gerçekten çok seviyorum.</p>
  <div class="heart">💓</div>
  <button class="button" onclick="alert('Teşekkür ederim aşkım...')">Affettim 💌</button>
</body>
</html>
